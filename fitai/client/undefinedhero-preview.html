<!doctype html><html><head><meta charset=utf8><style>
:root{--text:#1a1a1a;--muted:#555;--faint:#999;--border:#e2e2e2;--border2:#ccc;--s3:.75rem;--s4:1rem;--s5:1.5rem;--t-label:.6875rem;--font-mono:ui-monospace,monospace}
body{font-family:Georgia,serif;max-width:640px;margin:40px auto;color:var(--text)}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono);font-size:var(--t-label);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{font-size:2.6rem;letter-spacing:-.035em;line-height:1.04;max-width:15ch;font-weight:620}
h1 em{font-style:italic;font-weight:500}
.hero-standfirst{max-width:44ch;font-size:1.0625rem;line-height:1.6;margin:1rem 0 1.5rem;color:var(--muted)}
.hero-loop{list-style:none;margin:1.5rem 0;padding:0;max-width:44ch}
.hero-loop-step{display:grid;grid-template-columns:2.25rem minmax(0,1fr);align-items:baseline;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border)}
.hero-loop-step:last-child{border-bottom:1px solid var(--border)}
.hero-loop-index{font-size:var(--t-label);letter-spacing:.14em;color:var(--faint)}
.hero-loop-text{font-size:1.0625rem;line-height:1.5;color:var(--muted)}
.hero-loop-text em{font-style:normal;font-weight:600;color:var(--text)}
</style></head><body>
<p class=eyebrow>Your goal · measured daily</p>
<h1>Train like the <em>hero</em> of your own story.</h1>
<p class=hero-standfirst>One AI coach, running your training on a loop.</p>
<ol class=hero-loop>
<li class=hero-loop-step><span class="hero-loop-index mono">01</span><span class=hero-loop-text><em>Builds</em> the plan</span></li>
<li class=hero-loop-step><span class="hero-loop-index mono">02</span><span class=hero-loop-text><em>Keeps</em> the score</span></li>
<li class=hero-loop-step><span class="hero-loop-index mono">03</span><span class=hero-loop-text><em>Rewrites</em> tomorrow — from how today actually went</span></li>
</ol>
</body></html>
